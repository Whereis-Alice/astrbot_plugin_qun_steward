name: astrbot_plugin_qun_steward
display_name: 群务管家
desc: "[仅 aiocqhttp] 一站式 QQ 群管理与群相册插件：成员管理、消息治理、进群审核、增强欢迎、群待办、群管理策略、群文件与群相册、群情报榜单、AI 声聊，附带可视化 WebUI、操作审计与安全确认。"
help: |
  仅支持 aiocqhttp 平台（NapCat / LLOneBot(llbot) / SnowLuma 均已适配）。
  群内发送「群务帮助」可查看带说明的完整指令表；WebUI 面板在 AstrBot「插件管理 → 群务管家」中打开。

  【禁言与成员】禁言 / 解禁 / 全禁 / 改名 / 改头衔 / 申请头衔 / 踢了 / 群拉黑 / 上管 / 下管 / 群友信息 / 清理群友
  【消息治理】撤回 / 设精 / 移精 / 群精华 / 设置禁词 / 内置禁词 / 禁词禁言 / 刷屏禁言 / 投票禁言（支持贴表情计票）
  【群务设置】设置群名 / 设置群头像 / 全体成员 / 发布群公告 / 群公告 / 删除群公告 / 开启宵禁 / 关闭宵禁
  【进群退群】进群审核 / 进群白词 / 进群黑词 / 未命中驳回 / 进群等级 / 进群次数 / 进群黑名单 / 待审进群 / 批准 / 驳回 / 进群禁言 / 进群欢迎 / 退群通知 / 退群拉黑
  【增强欢迎】欢迎开关 / 欢迎模板 / 欢迎图片 / 欢迎模式 / 欢迎延迟 / 入群验证 / 验证动作 / 验证次数 / 欢迎测试 / 欢迎配置
  【群文件】查看群文件 / 上传群文件 / 删除群文件 / 群文件直链 / 群文件容量 / 移动群文件 / 重命名群文件 / 删除群文件夹 / 重命名群文件夹 / 整理群文件
  【群相册】上传群相册 / 查看群相册 / 随机图 / 删相册图
  【群待办】设群待办 / 群待办 / 完成群待办 / 取消群待办
  【群管理策略】设置加群方式 / 设置入群问题 / 群搜索 / 成员邀请 / 新成员历史
  【群情报】群信息 / 群荣誉 / 禁言列表 / 声聊 / 声聊音色
  【插件自身】群管配置 / 群管重置 / 操作日志 / 撤销 / 群务帮助

  提示：绝大多数开关都能「按群覆写」，没写覆写的群自动跟随全局默认配置；危险操作（踢人、拉黑、清理群友）留有「撤销」窗口。
